[package]
name = "affix"
version = "0.1.0"
edition = "2024"
authors = ["0x484558 <0x484558@pm.me>"]
description = "Enforces process affinity and efficiency policies."

[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "3"

[features]
default = []
heuristics = ["dep:aho-corasick"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rusqlite = { version = "0.37.0", features = ["bundled"] }
aho-corasick = { version = "1.1.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.177"
zbus = { version = "5.15.0", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
tracing-etw = "0.2.3"
win_etw_provider = "0.1.14"
win_etw_tracing = "0.1.7"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
overflow-checks = false
panic = "abort"
strip = true
